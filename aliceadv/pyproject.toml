[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aliceadv"
# 版本不写在这里：唯一来源是 src/aliceadv/_version.py 的 __version__，
# 由下面的 [tool.setuptools.dynamic] 读取。改版本只需编辑那一行。
dynamic = ["version"]
description = "aliceADV — a Ren'Py-style web ADV (visual novel) game engine: project template + create/build compiler"
readme = "README.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
keywords = ["adv", "visual-novel", "renpy", "game-engine", "web", "visual-novel-engine"]
authors = [
    { name = "AliceDrop" },
]
maintainers = [
    { name = "AliceDrop" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Alice-Drop/aliceADV"
Repository = "https://github.com/Alice-Drop/aliceADV"
Documentation = "https://github.com/Alice-Drop/aliceADV"

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.scripts]
aliceadv = "aliceadv.cli:main"

# 模板（index.html / style / gui / images / audio / story 等）是纯数据，
# 与编译器实现解耦：将来用其他语言重写编译器时直接复用该目录。
[tool.setuptools.packages.find]
where = ["src"]

# 包版本的唯一来源：src/aliceadv/_version.py 的 __version__。
# 该文件保持「零依赖 + 单条赋值」，setuptools 会静态解析它，不 import 包。
[tool.setuptools.dynamic]
version = { attr = "aliceadv._version.__version__" }

[tool.setuptools]
include-package-data = true

# 显式声明包内数据文件，确保 wheel 与 sdist 都带上模板（含隐藏标记文件）。
[tool.setuptools.package-data]
aliceadv = [
    "template/**/*",
    "template/.aliceadv_engine",
]
